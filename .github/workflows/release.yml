{"name":"release","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"release":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4","with":{"submodules":"recursive"}},{"uses":"actions/setup-java@v4","with":{"distribution":"zulu","java-version":19}},{"uses":"gradle/actions/setup-gradle@v4"},{"name":"keystore","env":{"KS":"${{ secrets.KEYSTORE_B64 }}"},"run":"echo \"$KS\" | base64 -d > \"$RUNNER_TEMP/release.keystore\" && echo \"KEYSTORE_FILE=$RUNNER_TEMP/release.keystore\" >> \"$GITHUB_ENV\""},{"name":"build","env":{"KEYSTORE_PASSWORD":"${{ secrets.KEYSTORE_PASSWORD }}","KEY_ALIAS":"${{ secrets.KEY_ALIAS }}","KEY_PASSWORD":"${{ secrets.KEY_PASSWORD }}"},"run":"touch local.properties && chmod +x gradlew && ./gradlew assembleRelease"},{"name":"publish","env":{"GH_TOKEN":"${{ github.token }}"},"run":"v() { grep -E \"^$1\" version.properties | cut -d= -f2 | tr -d '[:space:]'; }; tag=\"$(v majorVersion).$(v minorVersion).$(v patchVersion)\"; gh release create \"$tag\" app/build/outputs/apk/release/*.apk --title \"$tag\" --notes \"AA Mazda Monitor $tag\""}]}}}