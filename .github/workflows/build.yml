name: build
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply petrol patch
        run: if [ -f aa-mazda-petrol.patch ]; then git apply aa-mazda-petrol.patch && echo "petrol patch applied"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 19
      - uses: gradle/actions/setup-gradle@v4
      - run: touch local.properties && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
